<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2a30"/>
      <stop offset="1" stop-color="#0a0a0d"/>
    </linearGradient>
  </defs>
  <!-- macOS squircle plate -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <!-- Z as a node graph: TL -> TR -> BL -> BR -->
  <g stroke="#f4f4f5" stroke-width="72" stroke-linecap="round" fill="none">
    <line x1="302" y1="330" x2="722" y2="330"/>
    <line x1="722" y1="330" x2="302" y2="694"/>
    <line x1="302" y1="694" x2="722" y2="694"/>
  </g>
  <!-- connection dots: white endpoints, gray mid-corners (rotationally symmetric like the Z) -->
  <circle cx="722" cy="330" r="72" fill="#a8a8b2"/>
  <circle cx="302" cy="694" r="72" fill="#a8a8b2"/>
  <circle cx="302" cy="330" r="84" fill="#ffffff"/>
  <circle cx="722" cy="694" r="84" fill="#ffffff"/>
</svg>
