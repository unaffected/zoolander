<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Zoolander</title>
    <style>
      /* Pre-React loading state; replaced when the app mounts. */
      #root:empty {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #fff;
      }
      #root:empty::after {
        content: '';
        width: 28px;
        height: 28px;
        border-radius: 50%;
        border: 3px solid rgba(128, 128, 128, 0.25);
        border-top-color: rgba(128, 128, 128, 0.85);
        animation: zl-spin 0.8s linear infinite;
      }
      @media (prefers-color-scheme: dark) {
        #root:empty {
          background: #09090b;
        }
      }
      @keyframes zl-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
